<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%" fill="none">
  <!-- Centered Icon (160x160) -->
  <g transform="translate(100, 24) scale(0.8)">
    
  <!-- UniStudy Academic Crest Mark -->
  <g id="unistudy-icon">
    <!-- Graduation Cap / Mortarboard Apex -->
    <g id="mortarboard">
      <!-- Cap Top Diamond Plane -->
      <polygon points="100,26 170,58 100,90 30,58" fill="#000000" />
      <!-- Top Plane Highlight / Facet -->
      <polygon points="100,26 170,58 100,90 100,26" fill="#000000" opacity="0.3" />
      
      <!-- Skullcap Under-Arch -->
      <path d="M 58,70 Q 100,94 142,70 L 142,82 Q 100,106 58,82 Z" fill="#000000" />
      
      <!-- Cap Center Button -->
      <ellipse cx="100" cy="58" rx="4.5" ry="3.5" fill="#FFFFFF" />
      
      <!-- Tassel Ribbon & Bob -->
      <path d="M 100,58 Q 140,58 168,68 L 172,98" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none" />
      <polygon points="168,96 176,96 174,110 170,110" fill="#000000" />
    </g>

    <!-- Monumental 'U' Columns / Open Book Laurels -->
    <g id="u-monolith">
      <!-- Left Pillar -->
      <path d="M 44,92 
               L 72,104 
               L 72,138 
               C 72,154 84,164 100,164 
               L 100,188 
               C 66,188 44,168 44,136 
               Z" 
            fill="#000000" />

      <!-- Right Pillar -->
      <path d="M 156,92 
               L 128,104 
               L 128,138 
               C 128,154 116,164 100,164 
               L 100,188 
               C 134,188 156,168 156,136 
               Z" 
            fill="#000000" />

      <!-- Upper Bevel Highlights on Pillars -->
      <polygon points="44,92 72,104 72,98 44,86" fill="#000000" opacity="0.45" />
      <polygon points="156,92 128,104 128,98 156,86" fill="#000000" opacity="0.45" />
    </g>

    <!-- Central Beacon / Academic Starburst -->
    <g id="academic-beacon">
      <!-- Left Diamond Facet -->
      <polygon points="100,104 86,126 100,148 100,104" fill="#000000" />
      <!-- Right Diamond Facet -->
      <polygon points="100,104 114,126 100,148 100,104" fill="#000000" />
      <!-- Star Spark Core -->
      <circle cx="100" cy="126" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  </g>

  <!-- Centered Typography -->
  <g transform="translate(180, 220)">
    <!-- Wordmark & Pill -->
    <g transform="translate(0, 0)">
      <text x="-32" y="36" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-1" fill="#00004E" text-anchor="middle">
        Uni<tspan font-weight="700">Study</tspan>
      </text>
      <g transform="translate(68, 6)">
        <rect x="0" y="0" width="56" height="38" rx="8" fill="#000000" />
        <text x="28" y="26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
          AI
        </text>
      </g>
    </g>

    <!-- Subtitle Line -->
    <text x="0" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#5A6484" text-anchor="middle">
      UPSA SCHOLAR INTELLIGENCE
    </text>
  </g>
</svg>