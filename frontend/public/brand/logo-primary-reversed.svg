<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gold-badge-rev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B82E" />
      <stop offset="50%" stop-color="#D89A06" />
      <stop offset="100%" stop-color="#B88204" />
    </linearGradient>
    <filter id="badge-shadow-rev" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- High-Res Realistic 3D Collegiate Emblem -->
  <g transform="translate(0, 1)">
    <image href="/brand/crest-transparent.png" x="0" y="0" width="46" height="46" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(54, 0)">
    <!-- UniStudy (White on dark) -->
    <text x="0" y="28" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.8" fill="#FFFFFF">
      Uni<tspan font-weight="700">Study</tspan>
    </text>

    <!-- AI Pill Badge -->
    <g transform="translate(136, 7)" filter="url(#badge-shadow-rev)">
      <rect x="0" y="0" width="38" height="24" rx="6" fill="url(#gold-badge-rev)" />
      <text x="19" y="17" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" letter-spacing="0.5" fill="#00004E" text-anchor="middle">
        AI
      </text>
    </g>

    <!-- Descriptor Subtitle -->
    <text x="1" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.5" fill="#D89A06">
      UPSA ACADEMIC EXCELLENCE
    </text>
  </g>
</svg>
