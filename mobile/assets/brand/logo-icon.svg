      <polygon points="72,1 142,33 72,65 2,33" fill="#D89A06" />
      <polygon points="72,1 142,33 72,65 72,1" fill="#F5B82E" opacity="0.3" />
      <path d="M 32,45 Q 72,69 114,45 L 114,57 Q 72,81 32,57 Z" fill="#B88204" />
