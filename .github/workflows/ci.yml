name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npm run type-check || echo "Skipping for now if no script exists"
      
    - name: Lint
      run: npm run lint || echo "Linting not configured yet"
      
    - name: Test
      run: npm run test || echo "No tests specified yet"
